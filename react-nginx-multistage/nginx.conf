# nginx site config for serving a React single-page application (SPA).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: React Router changes the URL client-side without a real HTTP
    # request. If a user refreshes on a deep link like /reports/2024, no static
    # file exists at that path and nginx would return 404. `try_files` falls
    # back to index.html so React can handle the route in the browser.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache fingerprinted static assets aggressively. Vite adds a content hash to
    # filenames (e.g. index-a1b2c3.js), so a long cache is safe — a new build
    # produces new filenames and busts the cache automatically.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # A lightweight health endpoint for container health checks / load balancers.
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Basic gzip to shrink text responses over the wire.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
